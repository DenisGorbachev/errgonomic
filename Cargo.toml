[workspace]
resolver = "3"

[workspace.package]
version = "0.5.3"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/errgonomic"
repository = "https://github.com/DenisGorbachev/errgonomic"
keywords = ["error-handling", "utils", "macros"]
categories = ["rust-patterns", "development-tools", "development-tools::debugging", "no-std"]
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]
# "internal" dir should be included

[workspace.metadata.details]
name = "errgonomic"
title = "Errgonomic"
readme = { generate = true }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "errgonomic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Macros for ergonomic error handling with thiserror."
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "Errgonomic"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[lints]
workspace = true

[dependencies]
cfg-if = { version = "1" }
futures = { version = "0.3.31", optional = true }
shlex = { version = "1.3.0", optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
futures = "0.3"
pretty_assertions = "1.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
toml = "0.9"

[features]
default = ["std"]
std = ["tempfile", "thiserror/std"]
process = ["std", "shlex"]
